name: 4. Invoke APIs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
      test_type:
        description: 'Test type'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, full, crud]

env:
  SERVICE_NAME: payments-service
  OPENSHIFT_NAMESPACE: mortgage-app
  TEST_LOAN_ID: "11110000-0000-0000-0000-000000000001"
  TEST_CUSTOMER_ID: "11111111-1111-1111-1111-111111111111"

jobs:
  invoke-apis:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y jq
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"
      - uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}
      - id: url
        run: echo "url=https://$(oc get route ${{ env.SERVICE_NAME }} -o jsonpath='{.spec.host}')" >> $GITHUB_OUTPUT

      - name: Smoke Tests
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "🔥 Smoke Tests"
          curl -s "${URL}/api/health" | jq .
          curl -s "${URL}/api/payments" | jq '.data | length' | xargs -I {} echo "Found {} payments"

      - name: CRUD Tests
        if: github.event.inputs.test_type != 'smoke'
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "🧪 CRUD Tests"
          
          # Create Payment
          RESPONSE=$(curl -s -X POST "${URL}/api/payments" \
            -H "Content-Type: application/json" \
            -d '{
              "loanId": "${{ env.TEST_LOAN_ID }}",
              "customerId": "${{ env.TEST_CUSTOMER_ID }}",
              "amount": 5000,
              "paymentType": 1,
              "paymentMethod": 1
            }')
          echo "$RESPONSE" | jq .
          PAYMENT_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          
          if [ "$PAYMENT_ID" != "null" ]; then
            # Read
            curl -s "${URL}/api/payments/${PAYMENT_ID}" | jq .
            
            # Get by Loan
            curl -s "${URL}/api/payments/loan/${{ env.TEST_LOAN_ID }}" | jq '.data | length'
            
            # Get History
            curl -s "${URL}/api/payments/loan/${{ env.TEST_LOAN_ID }}/history" | jq .
            
            # Cancel (instead of delete)
            curl -s -X POST "${URL}/api/payments/${PAYMENT_ID}/cancel" | jq .
          fi

      - name: Test Schedule APIs
        if: github.event.inputs.test_type == 'full'
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "📅 Schedule Tests"
          curl -s "${URL}/api/payments/schedule/loan/${{ env.TEST_LOAN_ID }}" | jq .
